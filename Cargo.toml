[workspace]
members = ["agent-mesh-core", "agent-mesh-store", "python-bindings", "vvagent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Wensheng Wang <wenshengwang@gmail.com>"]
repository = "https://github.com/vivido-dev/vvagent"

[workspace.dependencies]
agent-mesh-core = { version = "0.1.0", path = "agent-mesh-core" }
agent-mesh-store = { version = "0.1.0", path = "agent-mesh-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
getrandom = "0.4"
clap = { version = "4.5", features = ["derive"] }
